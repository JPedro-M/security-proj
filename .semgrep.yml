rules:

  - id: js-eval-usage
    patterns:
      - pattern: eval($CODE)
    message: "Uso de eval — pode levar à execução remota de código. Evite eval()."
    languages: [javascript, typescript]
    severity: ERROR

  - id: js-child-process-exec
    patterns:
      - pattern: child_process.exec($CMD)
      - pattern: require("child_process").exec($CMD)
      - pattern: require('child_process').exec($CMD)
    message: "Uso de child_process.exec — executa comandos do sistema e pode permitir RCE se não for seguro."
    languages: [javascript, typescript]
    severity: ERROR

  - id: js-hardcoded-secret
    patterns:
      - pattern: $VAR = "secret"
      - pattern: $VAR = 'secret'
      - pattern: $VAR = "JWT_SECRET"
    message: "Possível segredo hard-coded no código. Use variáveis de ambiente e um cofre de segredos." 
    languages: [javascript, typescript]
    severity: WARNING

  - id: ts-insecure-orm-query
    patterns:
      - pattern: $MODEL.query($SQL)
    message: "Uso de queries diretas em modelos/ORM — verifique interpolação de parâmetros para evitar SQL injection."
    languages: [javascript, typescript]
    severity: WARNING

# Dica: para regras mais precisas e com exemplos de correção, consulte a documentação do Semgrep
# e adapte os padrões ao seu estilo de código NestJS/TypeScript.

  # Regras adicionais para identificar padrões de SQL injection comuns
  - id: js-sql-template-literal-in-query
    patterns:
      - pattern: $DB.query(`$TEMPLATE`)
      - pattern: manager.query(`$TEMPLATE`)
      - pattern: getManager().query(`$TEMPLATE`)
      - pattern: getRepository($R).query(`$TEMPLATE`)
    message: "Template literal passado diretamente para uma query — pode conter interpolação e levar a SQL injection. Use parâmetros preparados em vez de interpolação." 
    languages: [javascript, typescript]
    severity: ERROR

  - id: js-sql-string-concat-in-query
    patterns:
      - pattern: $DB.query($STR + $EXPR)
      - pattern: manager.query($STR + $EXPR)
      - pattern: getManager().query($STR + $EXPR)
      - pattern: getRepository($R).query($STR + $EXPR)
    message: "String concatenation usada para construir uma query — risco de SQL injection. Use bindings/parameters." 
    languages: [javascript, typescript]
    severity: ERROR

  - id: prisma-raw-query-unsafe
    patterns:
      - pattern: prisma.$queryRaw($RAW)
      - pattern: prisma.$executeRaw($RAW)
      - pattern: prisma.$queryRawUnsafe($RAW)
      - pattern: prisma.$executeRawUnsafe($RAW)
    message: "Uso de Prisma raw query. Confirme que parâmetros não são concatenados diretamente — prefira queries parametrizadas ou query builders seguros." 
    languages: [javascript, typescript]
    severity: ERROR

  - id: typeorm-manager-raw-query
    patterns:
      - pattern: manager.query($SQL)
      - pattern: connection.query($SQL)
      - pattern: queryRunner.query($SQL)
    message: "Uso de query raw no TypeORM — verifique se os parâmetros são passados separadamente para evitar SQL injection." 
    languages: [javascript, typescript]
    severity: ERROR

  - id: mysql2-pool-execute-string-concat
    patterns:
      - pattern: $POOL.execute($SQL + $EXPR)
      - pattern: $POOL.query($SQL + $EXPR)
      - pattern: $POOL.execute($SQL)
      - pattern: $POOL.query($SQL)
    message: "Possível SQL injection: `pool.execute`/`pool.query` chamado com string concatenada ou template — use parâmetros preparados (placeholders) em vez de concatenar/ interpolar valores do usuário."
    languages: [javascript, typescript]
    severity: ERROR

  - id: mysql2-pool-template-literal
    patterns:
      - pattern: $POOL.execute(`$TEMPLATE`)
      - pattern: $POOL.query(`$TEMPLATE`)
    message: "Template literal passado diretamente para `pool.execute`/`pool.query` — pode conter interpolação de valores não parametrizados (risco de SQL injection). Use parâmetros preparados." 
    languages: [javascript, typescript]
    severity: ERROR

  - id: mysql2-pool-interpolated-string
    patterns:
      - pattern: $POOL.execute($STR + $EXPR)
      - pattern: $POOL.query($STR + $EXPR)
    message: "Construção dinâmica de query (concatenação) detectada em mysql2 `pool.execute`/`pool.query` — prefira `pool.execute(sql, [params])` ou query parametrizada." 
    languages: [javascript, typescript]
    severity: ERROR