name: CI Pipeline com Análise de Vulnerabilidade

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout do código
      uses: actions/checkout@v3

    - name: Configurar Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '16'

    - name: Instalar dependências
      run: |
        npm install

    - name: Rodar testes unitários
      run: |
        npm run test

    - name: Rodar Análise de Vulnerabilidade com Semgrep
      run: |
        # Se estiver usando semgrep globalmente
        semgrep --config=auto --exclude=n
  